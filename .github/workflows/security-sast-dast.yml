name: SAST and DAST Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Code with CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev libatlas-base-dev gfortran

    - name: Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

    - name: Summarize CodeQL results
      run: |
        echo "### CodeQL SAST Scan Completed Successfully :white_check_mark:" >> $GITHUB_STEP_SUMMARY

  dast:
    name: Perform Dynamic Analysis with OWASP ZAP (DAST)
    runs-on: ubuntu-latest
    needs: analyze

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Python App (adjust this to match your entry point)
      run: |
        source venv/bin/activate
        nohup python app.py &  # Replace with your actual app entry point

    - name: Wait for App to Start
      run: sleep 10  # Adjust if app takes longer to boot

    - name: Start ZAP in Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io
        docker run -d --name zap -u zap -p 8090:8090 owasp/zap2docker-stable

    - name: Run ZAP Baseline Scan
      run: |
        docker exec zap zap-baseline.py -t http://host.docker.internal:8000 -g gen.conf -r zap-report.html || true

    - name: Upload ZAP Report as artifact
      uses: actions/upload-artifact@v3
      with:
        name: zap-report
        path: zap-report.html

    - name: Summarize ZAP Scan results
      run: |
        echo "### OWASP ZAP DAST Scan Completed. [ZAP Report Download Available] :mag:" >> $GITHUB_STEP_SUMMARY
