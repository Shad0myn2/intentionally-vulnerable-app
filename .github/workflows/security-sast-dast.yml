name: SAST and DAST Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Code with CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev libatlas-base-dev gfortran

    - name: Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Summarize CodeQL results
      run: |
        echo "### CodeQL SAST Scan Completed Successfully :white_check_mark:" >> $GITHUB_STEP_SUMMARY

  dast:
    name: Perform Dynamic Analysis with OWASP ZAP (DAST)
    runs-on: ubuntu-22.04
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install dependencies and run app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          nohup python app.py &

      - name: Wait for the app to start
        run: sleep 10

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network="host" -v $(pwd):/zap/wrk:rw -t owasp/zap2docker-stable \
            zap-baseline.py -t http://localhost:8000 -r zap-report.html || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: ZAP-DAST-Report
          path: zap-report.html

