name: SAST and DAST Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Code with CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libatlas-base-dev gfortran

      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Summarize CodeQL results
        run: |
          echo "### CodeQL SAST Scan Completed Successfully " >> $GITHUB_STEP_SUMMARY

  dast:
    name: Run ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies and run app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          nohup python app.py > app.log 2>&1 &

      - name: Show app logs (for debugging if it crashes early)
        run: |
          sleep 3
          echo "========== APP LOGS =========="
          cat app.log || echo "No logs found"
          echo "=============================="

      - name: Wait for the app to start
        run: |
          echo "Waiting for the app to start..."
          for i in {1..15}; do
            if curl --silent --fail http://localhost:8000 > /dev/null; then
              echo "✅ App is up!"
              break
            fi
            echo "⏳ App not up yet... retrying ($i/15)"
            sleep 5
          done

      - name: Run ZAP Baseline Scan
        run: |
          docker pull zaproxy/zap-stable
          docker run --rm --network="host" \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8000 \
            -r zap-report.html

      - name: Fail if report was not generated
        run: |
          if [ ! -f "$(pwd)/zap-report.html" ]; then
            echo "❌ ZAP report not found!"
            exit 1
          else
            echo "✅ ZAP report generated successfully!"
          fi

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP HTML Report
          path: zap-report.html