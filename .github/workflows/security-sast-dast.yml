name: SAST and DAST Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Code with CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Summarize CodeQL results
        run: echo "### CodeQL SAST Scan Completed Successfully ✅" >> $GITHUB_STEP_SUMMARY

  dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log working directory
        run: pwd

      - name: Pull ZAP Docker Image
        run: docker pull zaproxy/zaproxy:weekly

      - name: Run OWASP ZAP API Scan
        run: |
          docker run -v $(pwd):/zap/wrk/:rw -t zaproxy/zaproxy:weeklyzap-api-scan.py \
            -t openapi.json -f openapi -c api-scan.conf -r zap-report.html || true

      - name: Ensure ZAP report exists
        run: |
          if [ ! -f "./zap-report.html" ]; then
            echo "❌ ZAP report not found!"
            exit 1
          else
            echo "✅ ZAP report found."
          fi

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-DAST-Report
          path: zap-report.html
