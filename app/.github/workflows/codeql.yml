name: "CodeQL & DAST"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Analyze code for security vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v2
        with:
          language: python

      - name: Run OWASP ZAP DAST
        uses: zaproxy/action-full-scan@v0.5.0
        with:
          target: 'http://localhost:5000'  # Ensure this matches your app's URL
          apiKey: ${{ secrets.ZAP_API_KEY }}
